<nav class="barra-nav">
    <div class="contenedor">
        <h2>PANEL DE ADMINISTRACION</h2>
        <ul class="nav lista">
            @for (item of menu; track item.ruta) {
                <li class="nav-item">
                    <a class="nav-link" [routerLink]="item.ruta" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                        {{ item.label }}
                    </a>
                </li>
            } 
        </ul>

        <button
            type="button"
            class="btn-cerrar-sesion"
            (click)="cerrarSesion()"    
        >
            Cerrar sesión
        </button>
    </div>
</nav>

<router-outlet></router-outlet>
